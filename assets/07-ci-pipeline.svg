<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540" role="img" aria-labelledby="t d">
  <title id="t">CI 검증과 릴리스 파이프라인</title>
  <desc id="d">풀 리퀘스트가 린트, 보안, 테스트, 평가 검증을 통과해 main에 머지된 뒤 프리릴리스와 스테이블 승격 사다리를 거쳐 마켓플레이스에 게시되고, 주간 스케줄이 보안 유지보수를 수행하는 파이프라인 구조도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
      .pt { font-size: 13px; font-weight: 700; fill: #334155; }
      .h { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .hw { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .s { font-size: 11px; fill: #64748b; }
      .sw { font-size: 11px; fill: #cbd5e1; }
      .e { font-size: 11.5px; fill: #64748b; }
      .mono { font-family: 'Cascadia Mono','Consolas','Courier New',monospace; }
      .ln { fill: none; stroke: #94a3b8; stroke-width: 1.7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1080" height="540" fill="#ffffff"/>

  <path class="ln" d="M180 88 L216 88"/>
