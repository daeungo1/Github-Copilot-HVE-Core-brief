<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-labelledby="t d">
  <title id="t">AI-DLC 9단계 라이프사이클</title>
  <desc id="d">설정, 발견, 제품 정의, 분해, 스프린트 계획, 구현, 리뷰, 배포, 운영 9단계가 순차 진행되고 리뷰와 배포와 운영에서 구현 단계로 되돌아가는 피드백 루프를 가진 흐름도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
