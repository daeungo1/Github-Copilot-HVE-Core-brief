<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" role="img" aria-labelledby="t d">
  <title id="t">아티팩트 배포 채널</title>
  <desc id="d">.github 아래 아티팩트가 plugin.json 매니페스트를 단일 진실 원천으로 삼아 VS Code 익스텐션, Copilot CLI 플러그인, Git 클론 세 채널로 배포되어 Copilot Chat에서 사용되는 구조도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
      .h { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .hw { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .s { font-size: 11.5px; fill: #64748b; }
      .sw { font-size: 11.5px; fill: #cbd5e1; }
      .mono { font-family: 'Cascadia Mono','Consolas','Courier New',monospace; }
      .ln { fill: none; stroke: #94a3b8; stroke-width: 1.7; marker-end: url(#arrow); }
      /* GitHub Primer palette remap; CSS overrides presentation attributes. */
      [fill="#eef2ff"], [fill="#f0f9ff"] { fill: #ddf4ff; }
      [fill="#e0e7ff"] { fill: #b6e3ff; }
      [fill="#ecfdf5"] { fill: #dafbe1; }
      [fill="#fffbeb"], [fill="#fef9c3"] { fill: #fff8c5; }
      [fill="#fff1f2"] { fill: #ffebe9; }
      [fill="#f5f3ff"], [fill="#fdf2f8"] { fill: #fbefff; }
      [fill="#f8fafc"] { fill: #f6f8fa; }
      [fill="#4338ca"], [fill="#4f46e5"] { fill: #0969da; }
      [fill="#1e293b"] { fill: #1f2328; }
      [stroke="#6366f1"], [stroke="#0ea5e9"] { stroke: #0969da; }
      [stroke="#4f46e5"] { stroke: #0550ae; }
      [stroke="#10b981"] { stroke: #1a7f37; }
      [stroke="#f59e0b"], [stroke="#eab308"] { stroke: #9a6700; }
      [stroke="#f43f5e"] { stroke: #cf222e; }
      [stroke="#8b5cf6"], [stroke="#ec4899"] { stroke: #8250df; }
      [stroke="#94a3b8"], [stroke="#cbd5e1"] { stroke: #afb8c1; }
      [stroke="#c7d2fe"], [stroke="#bae6fd"] { stroke: #b6e3ff; }
      [stroke="#a7f3d0"] { stroke: #aceebb; }
      [stroke="#fde68a"] { stroke: #f8e3a1; }
      [stroke="#ddd6fe"] { stroke: #e0c5ff; }
    </style>
  </defs>

  <rect width="1040" height="400" fill="#ffffff"/>

  <path class="ln" d="M240 200 L296 200"/>
  <path class="ln" d="M490 200 C520 200 520 78 552 78"/>
  <path class="ln" d="M490 200 L552 200"/>
  <path class="ln" d="M490 200 C520 200 520 322 552 322"/>
  <path class="ln" d="M810 78 C840 78 840 200 866 200"/>
  <path class="ln" d="M810 200 L866 200"/>
  <path class="ln" d="M810 322 C840 322 840 200 866 200"/>

  <rect x="30" y="130" width="210" height="140" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <text class="h mono" x="135" y="164" text-anchor="middle">.github/</text>
  <text class="s" x="135" y="192" text-anchor="middle">agents 58 · prompts 49</text>
  <text class="s" x="135" y="212" text-anchor="middle">instructions 64 · skills 75</text>
  <text class="s" x="135" y="240" text-anchor="middle">패키지 하위 폴더만 배포 대상</text>

  <rect x="300" y="160" width="190" height="80" rx="12" fill="#4338ca"/>
  <text class="hw mono" x="395" y="192" text-anchor="middle">plugin.json</text>
  <text class="sw" x="395" y="214" text-anchor="middle">구성 단일 진실 원천</text>

  <rect x="556" y="40" width="254" height="76" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
  <text class="h" x="683" y="70" text-anchor="middle">VS Code Extension</text>
  <text class="s mono" x="683" y="92" text-anchor="middle">ise-hve-essentials.hve-core</text>

  <rect x="556" y="162" width="254" height="76" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text class="h" x="683" y="192" text-anchor="middle">Copilot CLI Plugin</text>
  <text class="s mono" x="683" y="214" text-anchor="middle">copilot plugin install hve-core</text>

  <rect x="556" y="284" width="254" height="76" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text class="h" x="683" y="314" text-anchor="middle">Git Clone / Fork</text>
  <text class="s" x="683" y="336" text-anchor="middle">자체 SDLC 소유 · 자유 수정</text>

  <rect x="866" y="160" width="150" height="80" rx="12" fill="#1e293b"/>
  <text class="hw" x="941" y="192" text-anchor="middle">Copilot Chat</text>
  <text class="sw" x="941" y="214" text-anchor="middle">에이전트 · 커맨드</text>
</svg>
