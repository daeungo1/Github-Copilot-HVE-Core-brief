<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 900" width="880" height="900" role="img" aria-labelledby="t d">
  <title id="t">HVE Core repository structure</title>
  <desc id="d">Repository root branching into .github, docs, scripts, evals, extension, and root metadata files, each expanding into its main entries</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .root { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .dir { font-size: 14px; font-weight: 600; fill: #1f2328; }
      .lf { font-size: 12.5px; fill: #1f2328; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .ln { fill: none; stroke: #afb8c1; stroke-width: 1.5; marker-end: url(#arrow); }
    </style>
  </defs>

