  <rect x="500" y="528" width="340" height="26" rx="6" fill="#f6f8fa" stroke="#f8e3a1"/>
  <text class="lf" x="514" y="546"><tspan class="mono">security/</tspan> pinning, permissions, feeds</text>
  <rect x="500" y="560" width="340" height="26" rx="6" fill="#f6f8fa" stroke="#f8e3a1"/>
  <text class="lf" x="514" y="578"><tspan class="mono">evals/</tspan> Vally evaluation runs</text>
  <rect x="500" y="592" width="340" height="26" rx="6" fill="#f6f8fa" stroke="#f8e3a1"/>
  <text class="lf" x="514" y="610"><tspan class="mono">plugins/</tspan> manifest sync</text>
  <rect x="500" y="624" width="340" height="26" rx="6" fill="#f6f8fa" stroke="#f8e3a1"/>
  <text class="lf" x="514" y="642"><tspan class="mono">extension/</tspan> VSIX prep and packaging</text>
  <rect x="500" y="656" width="340" height="26" rx="6" fill="#f6f8fa" stroke="#f8e3a1"/>
  <text class="lf" x="514" y="674"><tspan class="mono">tests/</tspan> Pester tests</text>
  <rect x="500" y="688" width="340" height="26" rx="6" fill="#f6f8fa" stroke="#f8e3a1"/>
  <text class="lf" x="514" y="706"><tspan class="mono">lib/</tspan> shared PowerShell modules</text>

  <rect x="500" y="740" width="340" height="26" rx="6" fill="#f6f8fa" stroke="#e0c5ff"/>
  <text class="lf" x="514" y="758">8 evaluation suites for agent behavior</text>
  <rect x="500" y="786" width="340" height="26" rx="6" fill="#f6f8fa" stroke="#b6e3ff"/>
  <text class="lf" x="514" y="804">VS Code extension templates and packaging</text>
  <rect x="500" y="832" width="340" height="26" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/>
