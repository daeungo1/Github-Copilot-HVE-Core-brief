  <rect x="30" y="425" width="170" height="48" rx="10" fill="#0969da"/>
  <text class="root mono" x="115" y="455" text-anchor="middle">hve-core/</text>

  <rect x="240" y="112" width="200" height="42" rx="9" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
