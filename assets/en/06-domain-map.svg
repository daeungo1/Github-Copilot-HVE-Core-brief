<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" width="780" height="640" role="img" aria-labelledby="t d">
  <title id="t">Domain agents converging on RPI implementation</title>
  <desc id="d">Planning, security, and accessibility agent chains route through the right-hand path into RPI implementation, whose output flows to code review and seven perspective subagents</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
    </marker>
    <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .pt { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .c { font-size: 14px; font-weight: 600; fill: #1f2328; }
      .m { font-size: 10.5px; fill: #59636e; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .h { font-size: 18px; font-weight: 700; fill: #1f2328; }
      .s { font-size: 12.5px; fill: #59636e; }
      .ln { fill: none; stroke: #afb8c1; stroke-width: 1.8; marker-end: url(#arrow); }
      .lns { fill: none; stroke: #afb8c1; stroke-width: 1.5; marker-end: url(#arrowS); }
      .lnp { fill: none; stroke: #afb8c1; stroke-width: 1.8; }
    </style>
  </defs>

