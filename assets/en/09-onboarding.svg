<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" width="1080" height="380" role="img" aria-labelledby="t d">
  <title id="t">Onboarding path for new users</title>
  <desc id="d">Five steps from installing the extension to reviewing tracking artifacts, then branching into domain planners, team rollout, and direct contribution</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .n { font-size: 11px; font-weight: 700; fill: #0969da; letter-spacing: .5px; }
      .h { font-size: 14px; font-weight: 700; fill: #1f2328; }
      .s { font-size: 11px; fill: #59636e; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .ln { fill: none; stroke: #afb8c1; stroke-width: 1.7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1080" height="380" fill="#ffffff"/>

  <path class="ln" d="M210 150 L236 150"/>
  <path class="ln" d="M420 150 L446 150"/>
  <path class="ln" d="M630 150 L656 150"/>
  <path class="ln" d="M840 150 L866 150"/>
  <path class="ln" d="M960 190 C960 244 360 240 360 272"/>
  <path class="ln" d="M960 190 C960 244 610 240 610 272"/>
  <path class="ln" d="M960 190 C960 244 860 240 860 272"/>

  <rect x="30" y="110" width="180" height="80" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text class="n" x="120" y="134" text-anchor="middle">STEP 1</text>
  <text class="h" x="120" y="156" text-anchor="middle">Install extension</text>
  <text class="s" x="120" y="176" text-anchor="middle">VS Code Marketplace</text>

  <rect x="240" y="110" width="180" height="80" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text class="n" x="330" y="134" text-anchor="middle">STEP 2</text>
  <text class="h" x="330" y="156" text-anchor="middle">Open Copilot Chat</text>
  <text class="s mono" x="330" y="176" text-anchor="middle">Ctrl+Alt+I</text>

  <rect x="450" y="110" width="180" height="80" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text class="n" x="540" y="134" text-anchor="middle">STEP 3</text>
  <text class="h" x="540" y="156" text-anchor="middle">Pick RPI Agent</text>
  <text class="s mono" x="540" y="176" text-anchor="middle">or /rpi</text>

  <rect x="660" y="110" width="180" height="80" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text class="n" x="750" y="134" text-anchor="middle">STEP 4</text>
  <text class="h" x="750" y="156" text-anchor="middle">Describe the task</text>
  <text class="s" x="750" y="176" text-anchor="middle">requirements · acceptance</text>

  <rect x="870" y="110" width="180" height="80" rx="10" fill="#b6e3ff" stroke="#0550ae" stroke-width="2.2"/>
  <text class="n" x="960" y="134" text-anchor="middle">STEP 5</text>
  <text class="h" x="960" y="156" text-anchor="middle">Read the artifacts</text>
  <text class="s mono" x="960" y="176" text-anchor="middle">.copilot-tracking/</text>

  <rect x="250" y="272" width="220" height="68" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6"/>
  <text class="h" x="360" y="300" text-anchor="middle">Add domain planners</text>
  <text class="s" x="360" y="320" text-anchor="middle">security · a11y · RAI · privacy</text>

  <rect x="500" y="272" width="220" height="68" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/>
  <text class="h" x="610" y="300" text-anchor="middle">Roll out to the team</text>
  <text class="s mono" x="610" y="320" text-anchor="middle">docs/customization/</text>

  <rect x="750" y="272" width="220" height="68" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6"/>
  <text class="h" x="860" y="300" text-anchor="middle">Contribute back</text>
  <text class="s mono" x="860" y="320" text-anchor="middle">/hve-builder</text>
</svg>
