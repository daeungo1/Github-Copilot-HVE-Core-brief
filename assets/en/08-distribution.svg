<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" role="img" aria-labelledby="t d">
  <title id="t">Artifact distribution channels</title>
  <desc id="d">Artifacts under .github flow through the plugin.json manifest into the VS Code extension, the Copilot CLI plugin, and Git clone, all reaching Copilot Chat</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .h { font-size: 15px; font-weight: 700; fill: #1f2328; }
      .hw { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .s { font-size: 11.5px; fill: #59636e; }
      .sw { font-size: 11.5px; fill: #d1d9e0; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .ln { fill: none; stroke: #afb8c1; stroke-width: 1.7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1040" height="400" fill="#ffffff"/>

  <path class="ln" d="M240 200 L296 200"/>
  <path class="ln" d="M490 200 C520 200 520 78 552 78"/>
  <path class="ln" d="M490 200 L552 200"/>
  <path class="ln" d="M490 200 C520 200 520 322 552 322"/>
  <path class="ln" d="M810 78 C840 78 840 200 866 200"/>
  <path class="ln" d="M810 200 L866 200"/>
  <path class="ln" d="M810 322 C840 322 840 200 866 200"/>

  <rect x="30" y="130" width="210" height="140" rx="12" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.8"/>
  <text class="h mono" x="135" y="164" text-anchor="middle">.github/</text>
  <text class="s" x="135" y="192" text-anchor="middle">agents 58 · prompts 49</text>
  <text class="s" x="135" y="212" text-anchor="middle">instructions 64 · skills 75</text>
  <text class="s" x="135" y="240" text-anchor="middle">only package subfolders ship</text>

  <rect x="300" y="160" width="190" height="80" rx="12" fill="#0969da"/>
  <text class="hw mono" x="395" y="192" text-anchor="middle">plugin.json</text>
  <text class="sw" x="395" y="214" text-anchor="middle">single source of truth</text>

  <rect x="556" y="40" width="254" height="76" rx="12" fill="#ddf4ff" stroke="#0969da" stroke-width="1.8"/>
  <text class="h" x="683" y="70" text-anchor="middle">VS Code Extension</text>
  <text class="s mono" x="683" y="92" text-anchor="middle">ise-hve-essentials.hve-core</text>

  <rect x="556" y="162" width="254" height="76" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.8"/>
  <text class="h" x="683" y="192" text-anchor="middle">Copilot CLI Plugin</text>
  <text class="s mono" x="683" y="214" text-anchor="middle">copilot plugin install hve-core</text>

  <rect x="556" y="284" width="254" height="76" rx="12" fill="#fff8c5" stroke="#9a6700" stroke-width="1.8"/>
  <text class="h" x="683" y="314" text-anchor="middle">Git Clone / Fork</text>
  <text class="s" x="683" y="336" text-anchor="middle">own your SDLC · modify freely</text>

  <rect x="866" y="160" width="150" height="80" rx="12" fill="#1f2328"/>
  <text class="hw" x="941" y="192" text-anchor="middle">Copilot Chat</text>
  <text class="sw" x="941" y="214" text-anchor="middle">agents · commands</text>
</svg>
