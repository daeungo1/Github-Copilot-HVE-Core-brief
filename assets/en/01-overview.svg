      .hub { font-size: 20px; font-weight: 700; fill: #ffffff; }
      .br { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .lf { font-size: 13px; fill: #1f2328; }
      .ln { fill: none; stroke: #afb8c1; stroke-width: 1.6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="900" height="700" fill="#ffffff"/>

