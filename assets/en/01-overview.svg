  <path class="ln" d="M500 437 C525 437 525 437 550 437"/>
  <path class="ln" d="M500 437 C525 437 525 479 550 479"/>

  <path class="ln" d="M500 585 C525 585 525 543 550 543"/>
  <path class="ln" d="M500 585 C525 585 525 585 550 585"/>
  <path class="ln" d="M500 585 C525 585 525 627 550 627"/>

  <rect x="40" y="312" width="200" height="64" rx="32" fill="#0969da"/>
  <text class="hub" x="140" y="352" text-anchor="middle">HVE Core</text>

  <rect x="310" y="97" width="190" height="46" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
