<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-labelledby="t d">
  <title id="t">The nine-stage AI-DLC lifecycle</title>
  <desc id="d">Nine stages run from setup through operations, with review, delivery, and operations all feeding back into implementation</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#afb8c1"/>
    </marker>
    <marker id="arrowd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d1d9e0"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .n { font-size: 11px; font-weight: 700; fill: #59636e; letter-spacing: .5px; }
      .h { font-size: 15px; font-weight: 700; fill: #1f2328; }
      .s { font-size: 11px; fill: #59636e; }
      .e { font-size: 11.5px; fill: #59636e; }
      .dt { font-size: 14px; font-weight: 600; fill: #1f2328; }
      .ln { fill: none; stroke: #afb8c1; stroke-width: 1.7; marker-end: url(#arrow); }
      .lnd { fill: none; stroke: #d1d9e0; stroke-width: 1.6; stroke-dasharray: 6 4; marker-end: url(#arrowd); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1120" height="560" fill="#ffffff"/>

  <path class="lnd" d="M230 96 C230 120 320 116 340 136"/>
  <text class="e" x="250" y="124">3 exit points</text>

  <path class="ln" d="M220 178 L246 178"/>
  <path class="ln" d="M430 178 L456 178"/>
  <path class="ln" d="M640 178 L666 178"/>
  <path class="ln" d="M850 178 L876 178"/>
  <path class="ln" d="M970 216 L970 316"/>
  <path class="ln" d="M876 358 L854 358"/>
  <path class="ln" d="M666 358 L644 358"/>
  <path class="ln" d="M456 358 L434 358"/>

  <path class="lnd" d="M760 396 C760 442 930 442 930 400"/>
  <text class="e" x="845" y="438" text-anchor="middle">rework</text>
  <path class="lnd" d="M550 396 C550 478 970 478 970 400"/>
  <text class="e" x="760" y="474" text-anchor="middle">next sprint</text>
  <path class="lnd" d="M340 396 C340 514 1010 514 1010 400"/>
  <text class="e" x="675" y="510" text-anchor="middle">hotfix</text>

  <rect x="40" y="36" width="380" height="60" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.6"/>
  <text class="dt" x="230" y="62" text-anchor="middle">Design Thinking, nine methods</text>
  <text class="s" x="230" y="82" text-anchor="middle">problem statement · validated concept · implementation spec</text>

  <rect x="40" y="140" width="180" height="76" rx="10" fill="#f6f8fa" stroke="#afb8c1" stroke-width="1.6"/>
  <text class="n" x="130" y="164" text-anchor="middle">STAGE 1</text>
  <text class="h" x="130" y="186" text-anchor="middle">Setup</text>
  <text class="s mono" x="130" y="205" text-anchor="middle">hve-core-installer</text>

  <rect x="250" y="140" width="180" height="76" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text class="n" x="340" y="164" text-anchor="middle">STAGE 2</text>
  <text class="h" x="340" y="186" text-anchor="middle">Discovery</text>
  <text class="s mono" x="340" y="205" text-anchor="middle">rpi-research · brd</text>

  <rect x="460" y="140" width="180" height="76" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.6"/>
  <text class="n" x="550" y="164" text-anchor="middle">STAGE 3</text>
  <text class="h" x="550" y="186" text-anchor="middle">Product definition</text>
  <text class="s mono" x="550" y="205" text-anchor="middle">prd-builder · adr</text>

  <rect x="670" y="140" width="180" height="76" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/>
  <text class="n" x="760" y="164" text-anchor="middle">STAGE 4</text>
  <text class="h" x="760" y="186" text-anchor="middle">Decomposition</text>
  <text class="s mono" x="760" y="205" text-anchor="middle">functional-planner</text>

  <rect x="880" y="140" width="180" height="76" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/>
  <text class="n" x="970" y="164" text-anchor="middle">STAGE 5</text>
  <text class="h" x="970" y="186" text-anchor="middle">Sprint planning</text>
  <text class="s mono" x="970" y="205" text-anchor="middle">backlog-manager</text>

  <rect x="880" y="320" width="180" height="76" rx="10" fill="#b6e3ff" stroke="#0550ae" stroke-width="2.2"/>
  <text class="n" x="970" y="344" text-anchor="middle">STAGE 6</text>
  <text class="h" x="970" y="366" text-anchor="middle">Implementation</text>
  <text class="s mono" x="970" y="385" text-anchor="middle">RPI Agent</text>

  <rect x="670" y="320" width="180" height="76" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6"/>
  <text class="n" x="760" y="344" text-anchor="middle">STAGE 7</text>
  <text class="h" x="760" y="366" text-anchor="middle">Review</text>
  <text class="s mono" x="760" y="385" text-anchor="middle">rpi-review · code-review</text>

  <rect x="460" y="320" width="180" height="76" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.6"/>
  <text class="n" x="550" y="344" text-anchor="middle">STAGE 8</text>
  <text class="h" x="550" y="366" text-anchor="middle">Delivery</text>
  <text class="s mono" x="550" y="385" text-anchor="middle">git-merge</text>

  <rect x="250" y="320" width="180" height="76" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.6"/>
  <text class="n" x="340" y="344" text-anchor="middle">STAGE 9</text>
  <text class="h" x="340" y="366" text-anchor="middle">Operations</text>
  <text class="s mono" x="340" y="385" text-anchor="middle">documentation</text>
</svg>
